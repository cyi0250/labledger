# A push that changes the tool is checked here again: validate, and the tests on the oldest and a current Python. A push
# of records alone runs nothing here, so a private ledger, whose Actions minutes are counted, spends none on its records.
# The pre-push hook has validated the whole tree of each tip it pushes, so a broken record from a commit that skipped the
# hooks (--no-verify, a clone without them, the GitHub web) stops the next push made with them. GitHub mails the pusher
# when a run fails.
name: validate
on:
  push:
    branches: ["**"]  # not the number counter (refs/labledger/ids), which carries no records
    paths: ["scripts/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
  workflow_dispatch:
concurrency:  # a burst of pushes runs at most twice: the one in progress and the newest waiting
  group: validate-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]  # the oldest Python the tool supports, and a current one
    steps:
      - uses: actions/checkout@v4
        with:  # validate finds the attachments in git's index; the tests do not read them
          sparse-checkout: |
            /*
            !/experiments/attachments/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet pytest
      - run: python scripts/labledger.py validate --committed
      - run: python -m pytest tests -q
